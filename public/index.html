<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GPA Tracker — 純前端、可離線、支援雲端同步的香港 VTC/IVE GPA 成績追蹤與試算工具。">
  <title>GPA Tracker - 本機成績追蹤</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 頂部導覽列 -->
  <nav class="navbar">
    <div class="navbar-brand">🎓 GPA Tracker <span class="navbar-badge">IT114105</span></div>
    <div id="account-area" class="navbar-account"></div>
  </nav>

  <!-- 認證 Modal（登入 / 註冊） -->
  <div id="auth-modal" class="modal hidden">
    <div class="modal-backdrop" onclick="window.__gpa && window.__gpa.closeAuthModal && window.__gpa.closeAuthModal()"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="auth-modal-title" class="modal-title">登入</h3>
        <button class="icon-btn" onclick="window.__gpa && window.__gpa.closeAuthModal && window.__gpa.closeAuthModal()" title="關閉">✕</button>
      </div>
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-tab="login">登入</button>
        <button type="button" class="auth-tab" data-tab="register">註冊</button>
      </div>
      <form id="auth-form" class="modal-body">
        <div class="field">
          <label class="label">Email</label>
          <input type="email" id="auth-email" required class="input" placeholder="你的 Email" autocomplete="email">
        </div>
        <div class="field">
          <label class="label">密碼</label>
          <input type="password" id="auth-password" required minlength="6" class="input" placeholder="至少 6 個字元" autocomplete="current-password">
        </div>
        <div id="auth-error" class="auth-error hidden"></div>
        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" onclick="window.__gpa && window.__gpa.closeAuthModal && window.__gpa.closeAuthModal()">取消</button>
          <button type="submit" class="btn btn-primary" id="auth-submit">登入</button>
        </div>
      </form>
      <div class="auth-social">
        <div class="auth-divider"><span>或使用</span></div>
        <button type="button" id="btn-google" class="btn btn-google">
          <svg class="google-icon" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          <span>使用 Google 帳號登入</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 評核 Modal -->
  <div id="assessment-modal" class="modal hidden">
    <div class="modal-backdrop" onclick="window.__gpa && window.__gpa.closeModal && window.__gpa.closeModal()"></div>
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title" class="modal-title">新增評核項目</h3>
        <button class="icon-btn" onclick="window.__gpa && window.__gpa.closeModal && window.__gpa.closeModal()" title="關閉">✕</button>
      </div>
      <form id="assessment-form" class="modal-body">
        <input type="hidden" id="form-id">
        <input type="hidden" id="form-courseId">

        <div class="field">
          <label class="label">評核名稱</label>
          <input type="text" id="form-name" required class="input" placeholder="例如：期末考、小測 1">
        </div>

        <div class="grid-2">
          <div class="field">
            <label class="label">組別</label>
            <select id="form-group" class="input">
              <option value="CA">CA (平時分)</option>
              <option value="EA">EA (期末/總評)</option>
              <option value="作業">作業</option>
              <option value="專題">專題</option>
              <option value="考試">考試 (計入EA門檻)</option>
              <option value="其他">其他 (不計EA門檻)</option>
            </select>
          </div>
          <div class="field">
            <label class="label">佔比權重 (%)</label>
            <input type="number" id="form-weight" required min="0" max="100" step="0.1" class="input" placeholder="例如：20">
          </div>
        </div>

        <div class="grid-2 score-grid">
          <div class="field">
            <label class="label">滿分 <span class="hint">(未知可留空)</span></label>
            <input type="number" id="form-max" min="1" step="0.1" class="input" placeholder="例如：100">
          </div>
          <div class="field">
            <label class="label">獲得得分 <span class="hint">(未評分留空)</span></label>
            <input type="number" id="form-earned" min="0" step="0.1" class="input" placeholder="留空">
          </div>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn btn-ghost" onclick="window.__gpa && window.__gpa.closeModal && window.__gpa.closeModal()">取消</button>
          <button type="submit" class="btn btn-primary">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="container">
    <header class="header">
      <div class="header-title-wrap">
        <p class="header-sub">資料來源：使用者提供之簡報與課程結構照片。未確認之校規將顯示為待確認。</p>
      </div>
      <div class="header-actions">
        <input type="file" id="import-file" accept="application/json,.json" class="hidden">
        <button id="btn-import" class="btn btn-ghost">⇪ 匯入備份</button>
        <button id="btn-export" class="btn btn-ghost">⇩ 匯出備份</button>
        <button id="btn-reset" class="btn btn-ghost btn-reset">↺ 重設資料</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="panel">
          <h2 class="panel-title">📅 學期總覽</h2>
          <ul id="term-list" class="term-list"></ul>

          <div class="cgpa-block">
            <h3 class="cgpa-title">✅ CGPA 狀態</h3>
            <p class="cgpa-note">排除「GPA 入帳待確認」科目</p>
            <div id="cgpa-display" class="cgpa-value">--</div>
            <div id="cgpa-coverage" class="cgpa-coverage"></div>
          </div>
        </div>
      </aside>

      <main class="main">
        <div id="course-container"></div>
      </main>
    </div>

    <footer class="footer">
      訪客模式資料儲存於本機瀏覽器；登入後資料雲端同步，不會公開給其他使用者。
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="engine.js"></script>
  <script src="seed-data.js"></script>
  <script src="storage.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
  <script src="app.js"></script>
</body>
</html>
